[project]
name = "ego-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "boto3>=1.42.6",
    "cos-python-sdk-v5>=1.9.40",
    "django==5.2",
    "django-cors-headers>=4.9.0",
    "django-htmx>=1.27.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=23.0.0",
    "loguru>=0.7.3",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.11",
    "pymysql>=1.1.2",
    "python-decouple>=3.8",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "tenacity>=9.1.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "translators>=6.0.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.14.8",
    "zappa>=0.61.2",
]

[tool.ruff]
# 设置全局选项
line-length = 128  # 行长度限制
unfixable = ["F401"]  # 默认检查但不自动修复未使用的导入 F401
