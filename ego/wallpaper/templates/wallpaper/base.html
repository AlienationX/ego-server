{% load static django_htmx %}
<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}本我壁纸{% endblock %}</title>

    <!-- 使用 CDN daisyUI 预构 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- 本地 daisyUI/ Tailwind 预构建输出，无需 CDN。大概75M，需单独构建 -->
    <!-- <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" /> -->
    <link rel="stylesheet" href="{% static 'wallpaper/css/light.css' %}">
    <link rel="stylesheet" href="{% static 'wallpaper/css/dark.css' %}">
    <link rel="stylesheet" href="{% static 'wallpaper/css/style.css' %}">

    <!-- logo设置 -->
    <link rel="icon" href="{% static 'wallpaper/logo.svg' %}">

    <!-- 必须引入htmx脚本 -->
    {% htmx_script %}

    {% block extra_head %}{% endblock %}
    {% block extra_css %}{% endblock %}
</head>

<body class="bg-base-200 min-h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <main class="max-w-6xl mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-6xl mx-auto p-4 text-xs text-gray-500 text-right">
        &copy; {% now "Y" %} Ego Wallpapers 本我壁纸
    </footer>
    <!-- <footer class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4">
        <aside>
            <p>Copyright © {% now "Y" %} - All right reserved by Ego Wallpapers</p>
        </aside>
    </footer> -->
</body>

</html>
