{% load static %}
<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}本我壁纸{% endblock %}</title>

    <!-- 使用 CDN daisyUI 预构 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <!-- 本地 daisyUI/ Tailwind 预构建输出 -->
    <!-- <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" /> -->

    {% block extra_head %}{% endblock %}
    <style>
        .thumb {
            object-fit: cover;
            width: 100%;
            height: 160px;
        }
    </style>
</head>

<body class="bg-base-200 min-h-screen">
    <main class="max-w-6xl mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-6xl mx-auto p-4 text-xs text-gray-500 text-right">&copy; {% now "Y" %} Ego Wallpapers 本我壁纸</footer>
    <!-- <footer class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4">
        <aside>
            <p>Copyright © {% now "Y" %} - All right reserved by Ego Wallpapers</p>
        </aside>
    </footer> -->
</body>

</html>
