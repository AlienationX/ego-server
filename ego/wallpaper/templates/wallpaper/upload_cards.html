<div id="upload-cards">
  {% if items %}
  <form id="cards-form" class="flex flex-col mb-6 gap-6" method="post">
    {% csrf_token %}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      {% for item in items %}
      {% include 'wallpaper/partials/_single_card.html' with index=forloop.counter0 index1=forloop.counter %}
      {% endfor %}
    </div>

    <!-- 提交事件 -->
    <div class="flex flex-wrap gap-3 justify-start">
      <!-- <input type="hidden" name="action" value="save"> -->
      <button id="save-all-btn" type="button" class="btn btn-sm btn-primary" hx-post="{% url 'wallpaper:upload' %}"
        hx-include="#cards-form" hx-vals='{ "action": "save" }' hx-target="#upload-cards" hx-swap="innerHTML">
        <span class="btn-text-normal">提交全部</span>
        <span class="btn-text-loading">
          <span class="loading loading-spinner loading-xs"></span>
          提交中...
        </span>
      </button>
      <button type="button" class="btn btn-sm btn-warning retry-btn" hx-post="{% url 'wallpaper:upload' %}" hx-include="#cards-form" hx-vals='{ "action": "retry_all" }' hx-target="#upload-cards" hx-swap="innerHTML">
        <span class="btn-text-normal">批量重新解析</span>
        <span class="btn-text-loading">
          <span class="loading loading-spinner loading-xs"></span>
          解析中...
        </span>
      </button>
      <button type="button" class="btn btn-sm btn-ghost">添加示例卡</button>
      <div id="save-all-timer" class="hidden text-sm text-gray-500 tabular-nums whitespace-nowrap self-center">
        耗时 <span id="save-all-timer-value">0.0</span>s
      </div>
    </div>
  </form>
  {% endif %}

  {% if msg %}
  <div class="mb-6 alert {{ alert_type }}">
    <span>{{ msg }}</span>
    <!-- <div>
      <button class="btn btn-sm">Deny</button>
      <button class="btn btn-sm btn-primary">Accept</button>
    </div> -->
  </div>
  {% endif %}
</div>

<script>
  (function () {
    // 标签 badges 跟随 input 框内容
    const tagsInputs = document.querySelectorAll('input[name="tags"]');
    tagsInputs.forEach(input => {
      function updateBadges() {
        const badgeContainer = input.closest('.form-control').querySelector('[id^="tags-badges-"]');
        if (!badgeContainer) return;
        const tagsList = input.value.split(',').filter(t => t.trim());
        badgeContainer.innerHTML = tagsList.map(t => `<span class="badge badge-soft badge-secondary badge-sm">${t.trim()}</span>`).join('');
      }
      input.addEventListener('input', updateBadges);
    });

    // UUID文件名切换逻辑
    const uuidCheckboxes = document.querySelectorAll('input[name^="use_uuid_"]');
    const uuidMap = new Map();

    uuidCheckboxes.forEach((checkbox) => {
      const index = checkbox.name.replace('use_uuid_', '');
      uuidMap.set(index, crypto.randomUUID().replace(/-/g, ''));

      function updateFilenameDisplay() {
        const idx = index;
        const displayElement = document.getElementById(`filename-display-${idx}`);
        const filenameInput = document.getElementById(`filename-input-${idx}`);
        const originalInput = document.getElementById(`original-filename-${idx}`);

        const originalFilename = originalInput.value;
        const ext = originalFilename.substring(originalFilename.lastIndexOf('.'));
        const jpgExt = ext.toLowerCase() === '.jpeg' ? '.jpg' : ext;
        const uuidFilename = uuidMap.get(idx) + jpgExt;

        if (checkbox.checked) {
          displayElement.textContent = uuidFilename;
          displayElement.title = uuidFilename;
          filenameInput.value = uuidFilename;
        } else {
          displayElement.textContent = originalFilename;
          displayElement.title = originalFilename;
          filenameInput.value = originalFilename;
        }
      }

      checkbox.addEventListener('change', updateFilenameDisplay);

      if (checkbox.checked) {
        updateFilenameDisplay();
      }
    });

    const saveButton = document.getElementById("save-all-btn");
    const timer = document.getElementById("save-all-timer");
    const timerValue = document.getElementById("save-all-timer-value");

    if (!saveButton || !timer || !timerValue) return;

    let startAt = null;
    let timerId = null;

    function tick() {
      if (!startAt) return;
      timerValue.textContent = ((Date.now() - startAt) / 1000).toFixed(1);
    }

    function startTimer() {
      startAt = Date.now();
      tick();
      timer.classList.remove("hidden");
      saveButton.disabled = true;
      if (timerId) window.clearInterval(timerId);
      timerId = window.setInterval(tick, 100);
    }

    function stopTimer() {
      tick();
      if (timerId) {
        window.clearInterval(timerId);
        timerId = null;
      }
      saveButton.disabled = false;
    }

    document.body.addEventListener("htmx:beforeRequest", function (event) {
      if (event.target === saveButton) {
        startTimer();
      }
    });

    document.body.addEventListener("htmx:afterRequest", function (event) {
      if (event.target === saveButton) {
        stopTimer();
      }
    });

    document.body.addEventListener("htmx:responseError", function (event) {
      if (event.target === saveButton) {
        stopTimer();
      }
    });

    document.body.addEventListener("htmx:sendError", function (event) {
      if (event.target === saveButton) {
        stopTimer();
      }
    });
  })();
</script>
