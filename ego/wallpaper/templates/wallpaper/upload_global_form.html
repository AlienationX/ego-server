<div id="global-form-container" hx-swap-oob="outerHTML:#global-form-container" x-show="!useAi" {% if use_ai %}style="display: none;"{% endif %} class="mt-5 pt-5 border-t border-base-300 relative">
  <div class="flex items-center mb-4 gap-2 text-primary">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
    </svg>
    <h4 class="text-sm font-semibold">全局设置</h4>
    <span class="text-xs text-base-content/60 font-normal ml-1">（更改将应用到下方所有图片）</span>
  </div>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- 第 1 行：分类 (第1列) & 专题 (第2列) -->
    <div class="form-control">
      <label class="label py-1">
        <span class="label-text text-xs font-medium">分类</span>
      </label>
      <select id="global_classify" name="global_classify" class="select select-bordered select-sm w-full focus:outline-none focus:border-primary">
        <option value="">请选择分类</option>
        {% for item in classifies %}
        <option value="{{ item.id }}">{{ item.name }} (ID:{{ item.id }})</option>
        {% endfor %}
      </select>
    </div>
    
    <div class="form-control">
      <label class="label py-1">
        <span class="label-text text-xs font-medium">专题</span>
      </label>
      <select id="global_subject" name="global_subject" class="select select-bordered select-sm w-full focus:outline-none focus:border-primary">
        <option value="">请选择专题</option>
        {% for item in subjects %}
        <option value="{{ item.id }}">{{ item.name }} (ID:{{ item.id }})</option>
        {% endfor %}
      </select>
    </div>

    <!-- 第 2 行：描述 (第1列) & 标签 (第2列) -->
    <div class="form-control">
      <label class="label py-1">
        <span class="label-text text-xs font-medium">描述</span>
      </label>
      <input id="global_description" name="global_description" type="text" value="" placeholder="请输入描述"
        class="input input-bordered input-sm w-full focus:outline-none focus:border-primary" />
    </div>

    <div class="form-control">
      <label class="label py-1">
        <span class="label-text text-xs font-medium">标签</span>
      </label>
      <input id="global_tags" name="global_tags" type="text" value="" placeholder="标签，逗号分隔"
        class="input input-bordered input-sm w-full focus:outline-none focus:border-primary" />
    </div>

    <!-- 第 3 行：权限级别 (第1列) & [评分 + 重置尺寸 + 使用UUID] (第2列) -->
    <div class="form-control">
      <label class="label py-1">
        <span class="label-text text-xs font-medium">权限级别</span>
      </label>
      <select id="global_access_level" name="global_access_level" class="select select-bordered select-sm w-full focus:outline-none focus:border-primary">
        <option value="0">免费壁纸 (0)</option>
        <option value="1" selected>看广告/VIP (1)</option>
        <option value="2">VIP专属 (2)</option>
      </select>
      <input type="checkbox" id="global_is_locked" name="global_is_locked" class="hidden" />
    </div>

    <div class="form-control flex flex-row items-end gap-4 pb-1">
      <div class="w-28 flex-shrink-0">
        <label class="label py-1">
          <span class="label-text text-xs font-medium">评分</span>
        </label>
        <input id="global_score" name="global_score" type="number" value="" min="0" max="5" step="0.1" placeholder="评分"
          class="input input-bordered input-sm w-full focus:outline-none focus:border-primary" />
      </div>
      <div class="flex items-center gap-4 py-1.5 flex-wrap">
        <label class="flex items-center gap-2 cursor-pointer hover:text-primary transition-colors">
          <span class="text-xs font-medium">重置尺寸</span>
          <input type="checkbox" id="global_resize" name="global_resize" class="toggle toggle-sm toggle-primary" />
        </label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-primary transition-colors">
          <span class="text-xs font-medium">使用UUID生成文件名</span>
          <input type="checkbox" id="global_use_uuid" name="global_use_uuid" class="toggle toggle-sm toggle-primary" />
        </label>
      </div>
    </div>
  </div>
</div>
