<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>欢迎注册本我壁纸</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            border-bottom: 3px solid #4A90E2;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .app-name {
            color: #4A90E2;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }
        .code-box {
            background-color: #f4f7fe;
            border: 2px dashed #4A90E2;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin: 30px 0;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #4A90E2;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
        .warning {
            background-color: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- <div class="header">
        <h1 class="app-name">本我壁纸</h1>
        <p>发现属于你的视觉盛宴</p>
    </div> -->

    <h2>欢迎注册本我壁纸！</h2>
    <p>您好！感谢您注册本我壁纸APP。请使用以下验证码完成账号验证：</p>

    <div class="code-box">{{ verification_code }}</div>

    <div class="warning">
        <strong>安全提示：</strong>
        此验证码用于验证您的身份，请勿泄露给他人。本我壁纸官方人员绝不会向您索要验证码。
    </div>

    <p>请在{{ expire_minutes }}分钟内使用此验证码。如果您未尝试注册，请忽略此邮件。</p>

    <div class="footer">
        <p>© {{ year }} 本我壁纸. 保留所有权利。</p>
        <p>如果您有任何疑问，请联系客服: support@ego-wallpaper.com</p>
    </div>
</body>
</html>
